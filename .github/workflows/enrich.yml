name: Analyse product photos

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many products to analyse in each of the 6 parallel jobs. Type 20 for a quick first test. 0 means everything that is new.'
        default: '0'
  schedule:
    - cron: '30 19 * * *'            # every night at 01:00 India time: only new or changed photos are analysed

permissions:
  contents: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]     # six helpers share the work, so a big catalogue finishes quickly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: fashion-clip-model-v1
      - name: Install the tools (about 3 minutes the first time)
        run: |
          pip install --quiet pillow numpy requests
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers
      - name: Analyse this share of the photos
        run: |
          P=products.json; [ -f "$P" ] || P=platform/products.json
          python enrich/enrich.py --products "$P" --existing data/enrichment.json --out "part-${{ matrix.shard }}.json" --shard ${{ matrix.shard }} --of 6 --limit ${{ inputs.limit || 0 }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: part-${{ matrix.shard }}.json

  merge:
    needs: analyse
    if: always() && needs.analyse.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: parts
      - name: Combine and save
        run: |
          P=products.json; [ -f "$P" ] || P=platform/products.json
          python enrich/merge.py data/enrichment.json "parts/part-*.json" "$P" data/enrichment.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/enrichment.json
          if git diff --cached --quiet; then echo "Nothing new to save"; else
            git commit -m "Update product photo analysis"
            git pull --rebase --autostash
            git push
          fi
